name: Diagnose public feed access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/checkFeedAccess.yaml
      - src/scrape/diagnose_access.py
      - src/scrape/diagnose_browser.py

permissions:
  contents: read

jobs:
  compare:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install requests==2.28.1 curl_cffi==0.16.1
      - run: python src/scrape/diagnose_access.py
      - if: runner.os == 'Linux'
        run: python -m pip install selenium
      - if: runner.os == 'Linux'
        run: python src/scrape/diagnose_browser.py
