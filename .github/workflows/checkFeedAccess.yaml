name: Diagnose public feed access

on:
  workflow_dispatch:
    inputs:
      full_comparison:
        description: Also compare other HTTP transports and an anonymous browser
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/checkFeedAccess.yaml
      - src/scrape/diagnose_access.py
      - src/scrape/diagnose_browser.py
      - src/scrape/diagnose_caesars_request.py

permissions:
  contents: read

jobs:
  compare:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.7"
      - name: Install matching diagnostic dependencies
        run: python -m pip install requests==2.28.1 urllib3==1.26.20 certifi==2026.10.23 charset-normalizer==2.1.1 idna==3.20 curl_cffi==0.16.1
      - name: Compare identical Caesars request
        run: python src/scrape/diagnose_caesars_request.py
      - if: inputs.full_comparison
        run: python src/scrape/diagnose_access.py
      - if: runner.os == 'Linux' && inputs.full_comparison
        run: python -m pip install selenium
      - if: runner.os == 'Linux' && inputs.full_comparison
        run: python src/scrape/diagnose_browser.py
