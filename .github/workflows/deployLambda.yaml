name: Deploy Lambda Function

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Python 3.9 builds are available on 22.04, not the current ubuntu-latest.
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install AWS CLI
        run: |
          sudo apt-get update && sudo apt-get install -y awscli

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/scrape/requirements.txt --target src/scrape

      - name: Test sportsbook adapters
        run: python -m unittest discover -s src/scrape/tests -v

      - name: Zip code
        run: |
          cd src/scrape
          zip -r ../../scrape-books.zip ./
          cd ../..

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name scrape-books \
            --zip-file fileb://scrape-books.zip \
            --region us-east-2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
