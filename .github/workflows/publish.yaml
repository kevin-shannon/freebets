name: github pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      # Preserve the existing CRA/TypeScript peer-dependency combination.
      - run: npm ci --legacy-peer-deps
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
        env:
          REACT_APP_ENABLE_BET365: ${{ vars.ENABLE_BET365 }}

      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: production
