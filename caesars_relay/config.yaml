name: Freebets Caesars Relay
version: "0.3.0"
slug: caesars_relay
description: Fetch Caesars odds and receive optional bet365 browser captures
url: https://github.com/kevin-shannon/freebets/tree/main/caesars_relay
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Caesars relay for your existing Cloudflare Tunnel
watchdog: http://[HOST]:[PORT:8787]/health
options:
  enable_bet365: false
  bet365_source: browser
  bet365_max_age_seconds: 120
  region: nj
  relay_token: ""
schema:
  enable_bet365: bool
  bet365_source: list(browser|direct)
  bet365_max_age_seconds: int(30,300)
  region: match(^[a-z]{2}$)
  relay_token: password
