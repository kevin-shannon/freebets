<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.ico" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-96.ico" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-180.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d1f22" />
    <script>
      try {
        var mode = JSON.parse(localStorage.getItem("style") || '"system"');
        document.documentElement.dataset.theme =
          mode === "light" || mode === "dark"
            ? mode
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta name="description" content="Sports Betting Aggregator Tool" />
    <title>Freebets</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
